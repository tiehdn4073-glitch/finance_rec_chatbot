<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinanFit 로그인</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #e9f8f3,
            #ffffff 50%,
            #edf8ff
        );
}

.top {
    height: 80px;

    display: flex;
    align-items: center;

    padding: 0 50px;

    background: white;
}

.logo {
    width: 145px;
}

.container {
    min-height: calc(100vh - 80px);

    display: flex;
    align-items: center;
    justify-content: center;
}

.login-box {
    width: 430px;

    padding: 45px;

    background: white;

    border-radius: 25px;

    box-shadow:
        0 20px 60px
        rgba(0, 80, 60, 0.12);
}

.title {
    color: #00856a;

    font-size: 30px;
    font-weight: 800;
}

.subtitle {
    color: #777;

    font-size: 14px;

    margin-top: 8px;
    margin-bottom: 32px;
}

label {
    display: block;

    font-size: 13px;
    font-weight: 700;

    margin-bottom: 8px;
}

input {
    width: 100%;
    height: 52px;

    border: 1px solid #dce6e2;

    border-radius: 12px;

    padding: 0 15px;

    font-size: 14px;

    margin-bottom: 18px;

    outline: none;
}

input:focus {
    border-color: #00856a;
}

button {
    width: 100%;
    height: 54px;

    border: 0;
    border-radius: 12px;

    background: #00856a;

    color: white;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;
}

button:hover {
    background: #006f59;
}

.signup {
    text-align: center;

    margin-top: 22px;

    color: #777;

    font-size: 14px;
}

.signup a {
    color: #00856a;

    text-decoration: none;

    font-weight: 700;
}

.error {
    padding: 12px;

    background: #fff1f1;

    color: #d33;

    border-radius: 10px;

    font-size: 13px;

    margin-bottom: 18px;
}

.success {
    padding: 12px;

    background: #edf9f5;

    color: #00856a;

    border-radius: 10px;

    font-size: 13px;

    margin-bottom: 18px;
}

</style>
</head>

<body>

<header class="top">

    <a href="/login">

        <img
            src="/static/logo.png"
            class="logo"
            alt="FinanFit"
        >

    </a>

</header>


<div class="container">

<div class="login-box">

    <div class="title">
        FinanFit
    </div>

    <div class="subtitle">
        나에게 딱 맞는 금융상품을 찾아보세요.
    </div>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <div
        id="success"
        class="success"
        style="display:none;"
    >
        회원가입이 완료되었습니다.
        로그인해주세요.
    </div>


    <form
        action="/login"
        method="post"
    >

        <label>
            아이디
        </label>

        <input
            type="text"
            name="username"
            placeholder="아이디"
            required
        >


        <label>
            비밀번호
        </label>

        <input
            type="password"
            name="password"
            placeholder="비밀번호"
            required
        >


        <button type="submit">
            로그인
        </button>

    </form>


    <div class="signup">

        아직 회원이 아니신가요?

        <a href="/signup">
            회원가입
        </a>

    </div>

</div>

</div>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );

if (
    params.get("signup")
    === "success"
) {

    document
        .getElementById("success")
        .style.display = "block";

}

</script>

</body>
</html>
