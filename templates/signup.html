<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>FinanFit 회원가입</title>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #e9f8f3,
            #ffffff 50%,
            #edf8ff
        );
}

.top {
    height: 80px;

    display: flex;
    align-items: center;

    padding: 0 50px;

    background: white;
}

.logo {
    width: 145px;
}

.wrapper {
    display: flex;

    justify-content: center;

    padding: 35px 20px 70px;
}

.box {
    width: 720px;

    padding: 42px 48px;

    background: white;

    border-radius: 25px;

    box-shadow:
        0 20px 60px
        rgba(0, 80, 60, 0.12);
}

h1 {
    margin: 0;

    color: #00856a;

    font-size: 28px;
}

.desc {
    color: #777;

    font-size: 14px;

    margin:
        8px 0 30px;
}

.grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 18px;
}

.field {
    display: flex;
    flex-direction: column;
}

label {
    font-size: 13px;

    font-weight: 700;

    margin-bottom: 7px;
}

input,
select {
    height: 48px;

    border: 1px solid #dce6e2;

    border-radius: 11px;

    padding: 0 13px;

    font-size: 14px;

    background: white;

    outline: none;
}

input:focus,
select:focus {
    border-color: #00856a;
}

.full {
    grid-column: 1 / 3;
}

.file {
    height: auto;

    padding: 13px;
}

.submit {
    width: 100%;

    height: 54px;

    margin-top: 28px;

    border: 0;

    border-radius: 12px;

    background: #00856a;

    color: white;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;
}

.submit:hover {
    background: #006f59;
}

.login {
    text-align: center;

    margin-top: 20px;

    color: #777;

    font-size: 14px;
}

.login a {
    color: #00856a;

    font-weight: 700;

    text-decoration: none;
}

.error {
    padding: 12px;

    background: #fff1f1;

    color: #d33;

    border-radius: 10px;

    font-size: 13px;

    margin-bottom: 18px;
}

@media(max-width:700px) {

    .box {
        padding: 30px 22px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: 1;
    }

}

</style>

</head>


<body>


<header class="top">

    <a href="/login">

        <img
            src="/static/logo.png"
            class="logo"
            alt="FinanFit"
        >

    </a>

</header>


<div class="wrapper">

<div class="box">

    <h1>
        회원가입
    </h1>

    <div class="desc">
        나에게 맞는 금융상품을 추천받기 위한
        정보를 입력해주세요.
    </div>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form
        action="/signup"
        method="post"
        enctype="multipart/form-data"
    >


    <div class="grid">


        <div class="field">

            <label>
                아이디
            </label>

            <input
                type="text"
                name="username"
                required
            >

        </div>


        <div class="field">

            <label>
                비밀번호
            </label>

            <input
                type="password"
                name="password"
                required
            >

        </div>


        <div class="field">

            <label>
                이름
            </label>

            <input
                type="text"
                name="name"
                required
            >

        </div>


        <div class="field">

            <label>
                이메일
            </label>

            <input
                type="email"
                name="email"
                required
            >

        </div>


        <div class="field">

            <label>
                나이
            </label>

            <input
                type="number"
                name="age"
                min="1"
                max="120"
                required
            >

        </div>


        <div class="field">

            <label>
                성별
            </label>

            <select
                name="gender"
                required
            >

                <option value="">
                    선택하세요
                </option>

                <option value="남성">
                    남성
                </option>

                <option value="여성">
                    여성
                </option>

                <option value="기타">
                    기타
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                투자성향
            </label>

            <select
                name="investment_type"
                required
            >

                <option value="">
                    선택하세요
                </option>

                <option value="안정형">
                    안정형
                </option>

                <option value="중립형">
                    중립형
                </option>

                <option value="공격형">
                    공격형
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                직업
            </label>

            <input
                type="text"
                name="job"
                placeholder="예: 직장인"
                required
            >

        </div>


        <div class="field">

            <label>
                연소득 (만원)
            </label>

            <input
                type="number"
                name="income"
                min="0"
                placeholder="예: 4000"
                required
            >

        </div>


        <div class="field">

            <label>
                프로필 사진
            </label>

            <input
                class="file"
                type="file"
                name="profile_image"
                accept="image/*"
            >

        </div>


    </div>


    <button
        class="submit"
        type="submit"
    >
        FinanFit 시작하기
    </button>


    </form>


    <div class="login">

        이미 계정이 있으신가요?

        <a href="/login">
            로그인
        </a>

    </div>


</div>

</div>

</body>
</html>
